<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Quadrata Seguros">
  <!-- Balão: quadrado bem arredondado, com o canto inferior direito quase em
       ponta — é ali que sai a cauda da fala. O caminho aparece duas vezes de
       propósito (uma para pintar, outra como máscara): SVG usado como imagem
       de fundo no CSS nem sempre resolve <use href>. -->
  <clipPath id="dentro">
    <path d="M58 6h104a52 52 0 0 1 52 52v142a14 14 0 0 1-14 14H58A52 52 0 0 1 6 162V58A52 52 0 0 1 58 6z"/>
  </clipPath>
  <path fill="#2f86f2" d="M58 6h104a52 52 0 0 1 52 52v142a14 14 0 0 1-14 14H58A52 52 0 0 1 6 162V58A52 52 0 0 1 58 6z"/>
  <!-- Halo branco em volta do "Q" -->
  <circle cx="102" cy="98" r="72" fill="#ffffff"/>
  <!-- O azul volta pelo canto inferior direito e encosta no traço do "Q" -->
  <g clip-path="url(#dentro)"><circle cx="194" cy="188" r="78" fill="#2f86f2"/></g>
  <!-- O "Q": anel grosso e cauda do mesmo peso, atravessando o traço -->
  <circle cx="102" cy="98" r="44" fill="none" stroke="#14294f" stroke-width="24"/>
  <path d="M124 120 147 147" fill="none" stroke="#14294f" stroke-width="24" stroke-linecap="round"/>
</svg>
