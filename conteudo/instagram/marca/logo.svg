<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 252" role="img" aria-label="Quadrata Seguros">
  <!-- Balão: corpo quadrado bem arredondado, com a cauda saindo do canto
       inferior direito e apontando para baixo e para a esquerda.
       O caminho aparece duas vezes de propósito — uma para pintar, outra como
       máscara: SVG usado como background-image no CSS nem sempre resolve <use>. -->
  <clipPath id="dentro">
    <path d="M44 6h132a38 38 0 0 1 38 38v170c0 34-30 58-88 63 26-16 42-31 42-49v-14H44a38 38 0 0 1-38-38V44A38 38 0 0 1 44 6z"/>
  </clipPath>
  <path fill="#2f86f2" d="M44 6h132a38 38 0 0 1 38 38v170c0 34-30 58-88 63 26-16 42-31 42-49v-14H44a38 38 0 0 1-38-38V44A38 38 0 0 1 44 6z"/>
  <!-- Halo branco em volta do "Q" -->
  <circle cx="110" cy="110" r="59" fill="#ffffff"/>
  <!-- O azul volta pelo canto inferior direito, por baixo da cauda do "Q" -->
  <g clip-path="url(#dentro)"><circle cx="200" cy="200" r="78" fill="#2f86f2"/></g>
  <!-- O "Q": anel e cauda do mesmo peso, a cauda atravessando o traço -->
  <circle cx="110" cy="108" r="33" fill="none" stroke="#12294d" stroke-width="17"/>
  <path d="M128 126 143 141" fill="none" stroke="#12294d" stroke-width="17" stroke-linecap="round"/>
</svg>
