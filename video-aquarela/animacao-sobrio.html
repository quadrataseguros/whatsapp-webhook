<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const mk = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};
const SCENE = 8, TOTAL = 62;
const scenes = ['g1', 'g2', 'g3', 'g4', 'g5', 'g6', 'g7', 'g8'];

/* partículas de poeira / bokeh */
const motes = (parentId, n, r) => Array.from({ length: n }, () => mk('circle', { r }, $(parentId)));
const d1 = motes('s1dust', 34, 2.4), d3 = motes('s3dust', 26, 2.4), d4 = motes('s4dust', 26, 2.4);
const bok2 = motes('s2bok', 10, 30), bok6 = motes('s6bok', 14, 30);
const moteMove = (arr, s, y0, h, sp) => arr.forEach((c, i) => {
  c.setAttribute('cx', (i * 83 + Math.sin(s * 0.4 + i) * 40 + 720) % 720);
  c.setAttribute('cy', y0 + ((i * 131 + s * sp) % h));
  c.setAttribute('opacity', 0.25 + 0.6 * Math.abs(Math.sin(s * 1.1 + i)));
});

/* aquarelas da cena 4 */
const washes = [[400, 1020, 70, 38, '#c98a3a', 0.6], [470, 1070, 80, 40, '#2f7f86', 2.0], [330, 1060, 60, 34, '#b8566a', 3.4], [520, 990, 58, 30, '#5a6fa0', 4.6], [380, 1110, 70, 34, '#7a9a5a', 5.6], [450, 960, 50, 26, '#d9b06a', 6.4]].map(w => ({ w, e: mk('ellipse', { fill: w[4], opacity: 0 }, $('s4w')) }));

/* folhas (cena 5) */
const leafCols = ['#f2a030', '#e2682a', '#ffc050', '#c8481f'];
const leafD = 'M 0 -12 Q 10 -2 0 14 Q -10 -2 0 -12 Z';
const leaves = Array.from({ length: 14 }, (_, i) => mk('path', { d: leafD, fill: leafCols[i % 4] }, $('s5leaves')));
const farLeaves = Array.from({ length: 8 }, (_, i) => mk('path', { d: leafD, fill: leafCols[(i + 1) % 4] }, $('s5far')));

/* pessoas de costas (cena 7), todas em silhueta */
function person(parent, o) {
  const g = mk('g', {}, parent);
  const legs = [0, 1].map(() => mk('line', { stroke: '#120c18', 'stroke-width': o.lw, 'stroke-linecap': 'round' }, g));
  mk('path', { d: `M ${-o.w} ${-o.h} Q 0 ${-o.h - 14} ${o.w} ${-o.h} L ${o.w * 0.85} ${-o.h * 0.38} L ${-o.w * 0.85} ${-o.h * 0.38} Z`, fill: '#120c18' }, g);
  mk('circle', { cx: 0, cy: -o.h - o.r * 1.1, r: o.r, fill: '#120c18' }, g);
  if (o.long) mk('path', { d: `M ${-o.r} ${-o.h - o.r} L ${-o.r * 1.1} ${-o.h + o.r * 1.4} L ${o.r * 1.1} ${-o.h + o.r * 1.4} L ${o.r} ${-o.h - o.r} Z`, fill: '#120c18' }, g);
  return { g, legs, o };
}
const fam = $('s7fam');
const dad = person(fam, { w: 52, h: 250, r: 34, lw: 22 });
const kid = person(fam, { w: 30, h: 135, r: 24, lw: 14 });
const mom = person(fam, { w: 46, h: 235, r: 32, lw: 20, long: true });
const arms = [0, 1].map(() => mk('line', { stroke: '#120c18', 'stroke-width': 11, 'stroke-linecap': 'round' }, fam));
const g7in = $('g7').children[0];
const shadows = [0, 1, 2].map(() => mk('polygon', { fill: '#120a18', opacity: 0.4 }, g7in));
shadows.forEach(p => g7in.insertBefore(p, $('s7fam')));
const birds = [0, 1, 2].map(() => mk('path', {}, $('s7b')));
const legCycle = (p, ph, amp) => {
  const o = p.o;
  p.legs[0].setAttribute('x1', -o.w * 0.35); p.legs[0].setAttribute('y1', -o.h * 0.4);
  p.legs[1].setAttribute('x1', o.w * 0.35); p.legs[1].setAttribute('y1', -o.h * 0.4);
  p.legs[0].setAttribute('x2', -o.w * 0.35 + Math.sin(ph) * amp); p.legs[0].setAttribute('y2', -Math.max(0, Math.cos(ph)) * 10);
  p.legs[1].setAttribute('x2', o.w * 0.35 - Math.sin(ph) * amp); p.legs[1].setAttribute('y2', -Math.max(0, -Math.cos(ph)) * 10);
};

function cam(id, s, z0, z1, cx, cy, i) {
  const z = lerp(z0, z1, clamp(s / SCENE));
  const dx = Math.sin(s * 0.7 + i) * 3, dy = Math.cos(s * 0.55 + i * 2) * 3;
  $(id).setAttribute('transform', `translate(${cx + dx} ${cy + dy}) scale(${z}) translate(${-cx} ${-cy})`);
}

function render(T) {
  scenes.forEach((id, i) => { if (i > 0) $(id).setAttribute('opacity', seg(T, i * SCENE - 0.9, i * SCENE)); });
  $('grainr').setAttribute('opacity', 0.28 + 0.04 * Math.sin(T * 40));

  /* 1: espera */
  {
    const s = T; cam('g1', s, 1.0, 1.07, 420, 760, 1);
    const w = Math.sin(s * 1.3), w2 = Math.sin(s * 1.7 + 1);
    $('s1cl').setAttribute('d', `M 380 150 L 470 150 L ${470 + w * 18} 500 Q ${450 + w2 * 24} 700 ${430 + w * 30} 820 L 380 820 Z`);
    $('s1cr').setAttribute('d', `M 700 150 L 610 150 L ${610 - w2 * 18} 500 Q ${630 - w * 24} 700 ${650 - w2 * 30} 820 L 700 820 Z`);
    $('s1w').setAttribute('transform', `translate(0 ${Math.sin(s * 1.6) * 2.5})`);
    moteMove(d1, s, 220, 900, 10);
  }
  /* 2: chegada */
  {
    const s = T - SCENE; cam('g2', s, 1.0, 1.08, 400, 800, 2);
    $('s2h').setAttribute('transform', `translate(0 ${Math.sin(s * 1.8) * 3 - 120}) translate(400 800) scale(1.9) translate(-400 -800)`);
    const q = ((s - 1.5) / 3.2) % 1;
    $('s2tear').setAttribute('cy', 230 + clamp(q) * 190);
    $('s2tear').setAttribute('opacity', s > 1.5 ? 0.9 * Math.sin(Math.PI * clamp(q)) : 0);
    bok2.forEach((c, i) => {
      c.setAttribute('cx', (i * 137 + Math.sin(s * 0.3 + i) * 30 + 720) % 720);
      c.setAttribute('cy', 150 + (i * 191) % 520);
      c.setAttribute('r', 22 + (i % 4) * 14);
      c.setAttribute('opacity', 0.08 + 0.1 * Math.abs(Math.sin(s * 0.6 + i)));
    });
  }
  /* 3: crescer */
  {
    const s = T - 2 * SCENE; cam('g3', s, 1.0, 1.06, 360, 820, 3);
    const prog = ease(seg(s, 0.6, 7.0)), x = lerp(130, 440, prog), ph = s * 5.2;
    const walking = seg(s, 0.4, 0.8) * (1 - seg(s, 6.8, 7.3)), wob = Math.sin(s * 2.6) * 7 * walking;
    $('s3t').setAttribute('transform', `translate(${x + wob} ${Math.abs(Math.sin(ph)) * -5 * walking})`);
    const set = (id, d) => $(id).setAttribute('d', d);
    const l1 = Math.sin(ph) * 22 * walking, l2 = -l1;
    set('s3l1', `M -16 810 L ${-16 + l1} 934`); set('s3l2', `M 16 810 L ${16 + l2} 934`);
    const up = 1 - seg(s, 6.4, 7.4) * 0.6, aw = Math.sin(ph) * 8 * walking;
    set('s3r1', `M -34 722 Q -70 ${690 + aw} -84 ${650 * up + 700 * (1 - up) + aw}`);
    set('s3r2', `M 34 722 Q 70 ${690 - aw} 84 ${650 * up + 700 * (1 - up) - aw}`);
    const tx = x + wob, close = seg(s, 6.2, 7.6);
    const h1 = { x: lerp(430, tx + 50, close), y: lerp(790, 780, close) }, h2 = { x: lerp(440, tx + 52, close), y: lerp(870, 850, close) };
    set('s3a1', `M 562 740 Q 500 ${760 + Math.sin(s * 2) * 6} ${h1.x} ${h1.y}`);
    set('s3a2', `M 574 760 Q 510 ${830 + Math.sin(s * 2 + 1) * 6} ${h2.x} ${h2.y}`);
    moteMove(d3, s, 200, 800, 9);
  }
  /* 4: imaginação */
  {
    const s = T - 3 * SCENE; cam('g4', s, 1.0, 1.06, 340, 900, 4);
    washes.forEach(({ w, e }) => {
      const p = ease(seg(s, w[5], w[5] + 1.6));
      e.setAttribute('cx', w[0]); e.setAttribute('cy', w[1]);
      e.setAttribute('rx', w[2] * (0.4 + 0.6 * p)); e.setAttribute('ry', w[3] * (0.4 + 0.6 * p));
      e.setAttribute('opacity', 0.78 * p);
    });
    const pen = { x: 420 + 110 * Math.sin(s * 0.9), y: 1050 + 40 * Math.sin(s * 1.7) };
    $('s4arm').setAttribute('d', `M 380 770 Q ${380 + (pen.x - 380) * 0.3 + 60} ${770 + (pen.y - 770) * 0.6} ${pen.x} ${pen.y}`);
    $('s4br').setAttribute('x1', pen.x); $('s4br').setAttribute('y1', pen.y);
    $('s4br').setAttribute('x2', pen.x - 8); $('s4br').setAttribute('y2', pen.y + 34);
    moteMove(d4, s, 200, 800, 8);
  }
  /* 5: o tempo passa */
  {
    const s = T - 4 * SCENE; cam('g5', s, 1.0, 1.06, 400, 800, 5);
    $('s5h').setAttribute('transform', `translate(0 ${Math.sin(s * 1.2) * 3})`);
    $('s5hand').setAttribute('cy', 838 + Math.sin(s * 1.6) * 8);
    leaves.forEach((e, i) => {
      const x = (i * 59 + Math.sin(s * 0.8 + i * 1.3) * 60 + 900) % 760 - 20, y = ((i * 211 + s * 55) % 1380) - 60;
      e.setAttribute('transform', `translate(${x} ${y}) rotate(${s * 50 + i * 50}) scale(${0.8 + (i % 3) * 0.3})`);
    });
    farLeaves.forEach((e, i) => {
      const x = (i * 97 + Math.sin(s * 0.5 + i) * 90 + 900) % 780 - 30, y = ((i * 281 + s * 80) % 1400) - 70;
      e.setAttribute('transform', `translate(${x} ${y}) rotate(${s * 30 + i * 70}) scale(${2.4 + (i % 3) * 0.7})`);
      e.setAttribute('opacity', 0.55);
    });
  }
  /* 6: continuidade */
  {
    const s = T - 5 * SCENE; cam('g6', s, 1.0, 1.07, 360, 800, 6);
    $('s6h').setAttribute('transform', `translate(0 ${Math.sin(s * 1.5) * 4})`);
    bok6.forEach((c, i) => {
      c.setAttribute('cx', (i * 97 + Math.sin(s * 0.3 + i) * 30 + 720) % 720);
      c.setAttribute('cy', 80 + (i * 173) % 700);
      c.setAttribute('r', 24 + (i % 4) * 18);
      c.setAttribute('opacity', 0.1 + 0.12 * Math.abs(Math.sin(s * 0.7 + i)));
    });
  }
  /* 7: futuro */
  {
    const s = T - 6 * SCENE, p = seg(s, 0, SCENE);
    cam('g7', s, 1.0, 1.03, 360, 640, 7);
    const by = lerp(1210, 1040, p), sc = lerp(1.0, 0.72, p), ph = s * 3.2;
    $('s7fam').setAttribute('transform', `translate(360 ${by}) scale(${sc})`);
    const bob = a => Math.abs(Math.sin(ph + a)) * -5;
    dad.g.setAttribute('transform', `translate(-130 ${bob(0)})`); kid.g.setAttribute('transform', `translate(0 ${bob(0.5)})`); mom.g.setAttribute('transform', `translate(130 ${bob(0.2)})`);
    legCycle(dad, ph, 18); legCycle(kid, ph + 0.5, 12); legCycle(mom, ph + 0.2, 16);
    arms[0].setAttribute('x1', -130 + dad.o.w * 0.9); arms[0].setAttribute('y1', -dad.o.h * 0.8 + bob(0)); arms[0].setAttribute('x2', -30); arms[0].setAttribute('y2', -kid.o.h * 0.78 + bob(0.5));
    arms[1].setAttribute('x1', 130 - mom.o.w * 0.9); arms[1].setAttribute('y1', -mom.o.h * 0.8 + bob(0.2)); arms[1].setAttribute('x2', 30); arms[1].setAttribute('y2', -kid.o.h * 0.78 + bob(0.5));
    shadows.forEach((q, i) => {
      const x0 = 360 + [-130, 0, 130][i] * sc, w = [26, 14, 24][i] * sc, len = [520, 330, 480][i] * sc;
      q.setAttribute('points', `${x0 - w} ${by} ${x0 + w} ${by} ${x0 + w * 2.4 + 90} ${by + len} ${x0 - w * 1.2 + 70} ${by + len}`);
    });
    birds.forEach((b, i) => {
      const x = (i * 260 + s * 26) % 820 - 40, y = 300 + i * 70 + Math.sin(s * 1.5 + i) * 14, f = Math.sin(s * 6 + i) * 8;
      b.setAttribute('d', `M ${x - 18} ${y - f} Q ${x - 8} ${y - 8} ${x} ${y} Q ${x + 8} ${y - 8} ${x + 18} ${y - f}`);
    });
  }
  /* 8: final */
  {
    const s = T - 7 * SCENE;
    const f = (id, a, tr) => { const p = ease(seg(s, a, a + 0.9)); $(id).setAttribute('opacity', p); if (tr) $(id).setAttribute('transform', `translate(0 ${(1 - p) * 18})`); };
    f('e1', 0.8, true); $('e2').setAttribute('opacity', ease(seg(s, 2.0, 2.8))); f('e3', 2.6, true); f('e4', 3.6, true); f('e5', 4.4, false);
  }
}
render(0);
</script>
</body>
</html>
