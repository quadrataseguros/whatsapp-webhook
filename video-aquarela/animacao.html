<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (c1, c2, x) => {
  const a = hex(c1), b = hex(c2);
  return '#' + a.map((v, i) => Math.round(lerp(v, b[i], x)).toString(16).padStart(2, '0')).join('');
};
const mk = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};
const circ = (cx, cy, r) => `M ${cx - r} ${cy} a ${r} ${r} 0 1 1 ${2 * r} 0 a ${r} ${r} 0 1 1 ${-2 * r} 0`;
const rays = (cx, cy, r1, r2, n) => {
  let d = '';
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    d += `M ${cx + Math.cos(a) * r1} ${cy + Math.sin(a) * r1} L ${cx + Math.cos(a) * r2} ${cy + Math.sin(a) * r2} `;
  }
  return d;
};

const TOTAL = 29;

/* chuva na janela */
const rainEl = $('rain');
const rainLines = [];
for (let i = 0; i < 16; i++) rainLines.push(mk('line', {}, rainEl));

/* desenho da criança (traços progressivos) */
const strokes = [
  { d: circ(540, 925, 40), c: '#f5b800', w: 10, a: 4.2, b: 5.0, fill: '#ffe27a' },
  { d: rays(540, 925, 56, 82, 8), c: '#f5b800', w: 8, a: 5.0, b: 5.5 },
  { d: 'M 280 1100 L 280 1010 L 420 1010 L 420 1100 Z', c: '#e04b3a', w: 9, a: 5.5, b: 6.4, fill: '#f8c9bd' },
  { d: 'M 262 1014 L 350 945 L 438 1014 Z', c: '#b8472a', w: 9, a: 6.4, b: 6.9, fill: '#f4a261' },
  { d: 'M 336 1100 L 336 1055 L 366 1055 L 366 1100', c: '#6a3b2a', w: 8, a: 6.9, b: 7.2 },
  { d: 'M 530 1160 L 530 1075', c: '#7a4b2a', w: 10, a: 7.2, b: 7.5 },
  { d: circ(530, 1040, 46), c: '#3ea34a', w: 9, a: 7.5, b: 8.2, fill: '#a5dca0' },
  { d: 'M 230 1165 L 230 1112', c: '#3ea34a', w: 7, a: 8.2, b: 8.4 },
  { d: circ(230, 1096, 17), c: '#e85d9b', w: 8, a: 8.4, b: 8.8, fill: '#f48fb1' },
];
const drawG = $('m1draw');
strokes.forEach(s => {
  if (s.fill) s.fe = mk('path', { d: s.d, fill: s.fill, stroke: 'none', opacity: 0 }, drawG);
  s.el = mk('path', { d: s.d, stroke: s.c, 'stroke-width': s.w }, drawG);
  s.L = s.el.getTotalLength();
  s.el.setAttribute('stroke-dasharray', s.L);
});

/* ondas e arco-íris da M2 */
const wavesG = $('waves');
for (let i = 0; i < 6; i++) {
  mk('path', { d: 'M 0 0 q 20 -14 40 0 t 40 0 t 40 0 t 40 0' }, wavesG);
}
const rbCols = ['#ff6b6b', '#ff9f43', '#ffd84d', '#6bcB77', '#4d96ff', '#9b6bff'];
const rbArcs = rbCols.map((c, i) => {
  const r = 330 - i * 21;
  const p = mk('path', { d: `M ${400 - r} 760 A ${r} ${r} 0 0 1 ${400 + r} 760`, stroke: c, opacity: 0.85 }, $('rainbow'));
  p.L = p.getTotalLength();
  p.setAttribute('stroke-dasharray', p.L);
  return p;
});
const ripples = [0, 1, 2].map(() => mk('ellipse', {}, $('ripples')));

/* nuvens da M3 */
const clouds = [0, 1, 2].map(i => {
  const g = mk('g', {}, $('clouds'));
  mk('ellipse', { cx: 0, cy: 0, rx: 70, ry: 26 }, g);
  mk('ellipse', { cx: -30, cy: -18, rx: 38, ry: 28 }, g);
  mk('ellipse', { cx: 26, cy: -22, rx: 44, ry: 30 }, g);
  return g;
});

/* estrelas da M4 */
const starsG = $('stars');
const starEls = [];
for (let i = 0; i < 60; i++) {
  const x = (i * 137.5) % 720, y0 = (i * 211.3) % 1360, sp = 25 + (i * 53) % 60, rr = 1.5 + (i * 7) % 3;
  const c = mk('circle', { r: rr }, starsG);
  starEls.push({ c, x, y0, sp });
}

/* arco-íris do cartão final */
const endCols = ['#ff6b6b', '#ff9f43', '#ffd84d', '#6bcB77', '#4d96ff', '#9b6bff'];
const endArcs = endCols.map((c, i) => {
  const r = 230 - i * 24;
  const p = mk('path', { d: `M ${360 - r} 400 A ${r} ${r} 0 0 1 ${360 + r} 400`, stroke: c }, $('endarc'));
  p.L = p.getTotalLength();
  p.setAttribute('stroke-dasharray', p.L);
  return p;
});

const captions = [
  [0.8, 3.4, 'Às vezes, uma lembrança chega sem pedir licença…'],
  [4.2, 8.4, 'Lembra? A infância tinha todas as cores.'],
  [9.3, 13.2, 'Barquinhos de papel em poças de chuva…'],
  [14.3, 16.6, '…e sonhos que voavam bem alto.'],
  [17.8, 20.2, '…e o futuro, uma astronave de papelão.'],
  [21.4, 23.8, 'Hoje, é você quem pinta o futuro de quem ama.'],
];

function render(t) {
  $('turb').setAttribute('seed', (Math.floor(t * 8) % 40) + 1);

  /* ---- reveal da memória ---- */
  const r = 1250 * (ease(seg(t, 3.2, 5.0)) - ease(seg(t, 20.3, 22.0)));
  $('revc').setAttribute('r', Math.max(0, r));

  /* ---- sala: estado triste -> aquecido ---- */
  const warm = ease(seg(t, 20.6, 23.2));
  $('satm').setAttribute('values', lerp(0.25, 1, warm));
  $('wall').setAttribute('fill', mix('#9aa3b0', '#f1d3a8', warm));
  $('floor').setAttribute('fill', mix('#6f6a6a', '#b98a63', warm));
  $('winbg').setAttribute('fill', mix('#7d8aa0', '#8fd3f4', warm));
  $('rain').setAttribute('opacity', 1 - warm);
  $('winsun').setAttribute('opacity', warm);
  rainLines.forEach((l, i) => {
    const x = 404 + i * 17;
    const y = 236 + ((t * 420 + i * 97) % 520) - 30;
    l.setAttribute('x1', x); l.setAttribute('x2', x - 5);
    l.setAttribute('y1', y); l.setAttribute('y2', y + 30);
  });
  const smile = ease(seg(t, 20.8, 22.2));
  const breath = Math.sin(t * 1.6) * 3;
  $('adult').setAttribute('transform', `translate(0 ${breath})`);
  $('mouth').setAttribute('d', `M 276 ${590 - 3 * smile} Q 288 ${590 + 14 * smile} 301 ${584 - 8 * smile}`);
  $('brow').setAttribute('d', `M 277 ${556 + 2 * (1 - smile)} L 298 ${553 - 4 * (1 - smile) - 3 * smile}`);
  const tearP = seg(t, 21.3, 23.0);
  $('tear').setAttribute('opacity', tearP > 0 && tearP < 1 ? 0.9 : 0);
  $('tear').setAttribute('cy', 574 + tearP * 40);
  $('steam').setAttribute('opacity', 0.35 + 0.25 * Math.sin(t * 2.4));
  $('frame').setAttribute('opacity', ease(seg(t, 22.0, 23.0)));
  $('boat0').setAttribute('opacity', ease(seg(t, 22.3, 23.2)));

  /* ---- M1: desenhando ---- */
  strokes.forEach(s => {
    const p = seg(t, s.a, s.b);
    s.el.setAttribute('stroke-dashoffset', s.L * (1 - p));
    if (s.fe) s.fe.setAttribute('opacity', 0.75 * seg(t, s.b - 0.1, s.b + 0.4));
  });
  let pen = { x: 470, y: 1000 };
  for (let i = 0; i < strokes.length; i++) {
    const s = strokes[i];
    if (t >= s.a) {
      const p = seg(t, s.a, s.b);
      const pt = s.el.getPointAtLength(s.L * p);
      let from = pt;
      if (i > 0) from = strokes[i - 1].el.getPointAtLength(strokes[i - 1].L);
      const w = ease(seg(t, s.a, s.a + 0.3));
      pen = { x: lerp(from.x, pt.x, w), y: lerp(from.y, pt.y, w) };
    }
  }
  if (t < 4.2) pen = { x: 470 + Math.sin(t * 2) * 10, y: 1000 };
  const sh = { x: 410, y: 770 };
  $('m1arm').setAttribute('d', `M ${sh.x} ${sh.y} Q ${sh.x + (pen.x - sh.x) * 0.3 + 55} ${sh.y + (pen.y - sh.y) * 0.65} ${pen.x} ${pen.y}`);
  $('m1hand').setAttribute('cx', pen.x); $('m1hand').setAttribute('cy', pen.y);
  $('m1crayon').setAttribute('x1', pen.x); $('m1crayon').setAttribute('y1', pen.y);
  $('m1crayon').setAttribute('x2', pen.x - 8); $('m1crayon').setAttribute('y2', pen.y + 26);

  /* ---- M2: barquinho ---- */
  $('m2').setAttribute('opacity', seg(t, 8.2, 9.2));
  const bx = lerp(280, 620, seg(t, 9.0, 13.6));
  const by = 985 + Math.sin(t * 3.1) * 7;
  $('boat').setAttribute('transform', `translate(${bx} ${by}) rotate(${Math.sin(t * 2.2) * 4})`);
  [...wavesG.children].forEach((w, i) => {
    const off = (t * 28 + i * 31) % 160;
    w.setAttribute('transform', `translate(${220 + off - 160 + (i % 2) * 60} ${930 + i * 46})`);
    w.setAttribute('opacity', 0.8);
  });
  ripples.forEach((e, i) => {
    const ph = ((t * 0.7 + i / 3) % 1);
    e.setAttribute('cx', bx); e.setAttribute('cy', by + 44);
    e.setAttribute('rx', 60 + ph * 90); e.setAttribute('ry', 10 + ph * 20);
    e.setAttribute('opacity', (1 - ph) * 0.8);
  });
  rbArcs.forEach((p, i) => {
    p.setAttribute('stroke-dashoffset', p.L * (1 - ease(seg(t, 10.8 + i * 0.12, 12.6 + i * 0.12))));
  });
  const wave = Math.sin(t * 4);
  $('m2arm').setAttribute('d', `M 148 790 Q 200 ${760 + wave * 10} 250 ${775 + wave * 25}`);

  /* ---- M3: pipa ---- */
  $('m3').setAttribute('opacity', seg(t, 13.3, 14.3));
  const kx = 500 + Math.sin(t * 1.3) * 28, ky = 370 + Math.sin(t * 1.9) * 22;
  $('kite').setAttribute('transform', `translate(${kx} ${ky}) rotate(${Math.sin(t * 1.7) * 9})`);
  const tw = Math.sin(t * 3);
  $('ktail').setAttribute('d', `M 0 110 Q ${20 + tw * 14} 150 0 190 Q ${-20 - tw * 14} 230 0 270`);
  const hand = { x: 282, y: 903 + Math.abs(Math.sin(t * 6)) * -6 };
  $('kstring').setAttribute('d', `M ${hand.x} ${hand.y} Q ${(hand.x + kx) / 2 + 20} ${(hand.y + ky + 110) / 2 + 40} ${kx} ${ky + 110}`);
  const rs = Math.sin(t * 6);
  $('runner').setAttribute('transform', `translate(0 ${-Math.abs(rs) * 8})`);
  $('leg1').setAttribute('d', `M 190 970 L ${190 + rs * 34} 1050`);
  $('leg2').setAttribute('d', `M 190 970 L ${190 - rs * 34} 1050`);
  $('m3arm').setAttribute('d', `M 226 890 Q 262 ${862 + rs * 4} 282 ${905 - Math.abs(rs) * 6}`);
  clouds.forEach((c, i) => {
    const x = ((i * 330 + t * 22) % 900) - 100;
    c.setAttribute('transform', `translate(${x} ${180 + i * 150}) scale(${1 - i * 0.12})`);
  });

  /* ---- M4: astronave ---- */
  $('m4').setAttribute('opacity', seg(t, 16.6, 17.6));
  starEls.forEach((s, i) => {
    s.c.setAttribute('cx', s.x);
    s.c.setAttribute('cy', (s.y0 + (t - 16) * s.sp * 3 + 1360 * 10) % 1360 - 40);
    s.c.setAttribute('opacity', 0.45 + 0.55 * Math.abs(Math.sin(t * 2 + i)));
  });
  const shipUp = ease(seg(t, 16.8, 20.2));
  const sx = 360 + Math.sin(t * 1.1) * 36, sy = lerp(1050, 640, shipUp) + Math.sin(t * 3) * 7;
  $('ship').setAttribute('transform', `translate(${sx} ${sy}) rotate(${Math.sin(t * 1.4) * 5})`);
  const fl = Math.sin(t * 22);
  $('flame2').setAttribute('d', `M -26 62 Q 0 ${150 + fl * 14} 26 62 Z`);
  $('flame1').setAttribute('d', `M -14 62 Q 0 ${118 - fl * 10} 14 62 Z`);
  $('planet1').setAttribute('transform', `translate(130 ${300 + (t - 16) * 14})`);

  /* ---- legenda ---- */
  let capO = 0, capT = '';
  captions.forEach(([a, b, txt]) => {
    if (t >= a && t <= b) {
      capO = Math.min(seg(t, a, a + 0.5), 1 - seg(t, b - 0.5, b));
      capT = txt;
    }
  });
  $('cap').setAttribute('opacity', capO);
  if ($('captext').textContent !== capT && capT) {
    $('captext').textContent = capT;
    $('captext').setAttribute('font-size', 31);
    let bb = $('captext').getBBox();
    if (bb.width > 600) {
      $('captext').setAttribute('font-size', 31 * 600 / bb.width);
      bb = $('captext').getBBox();
    }
    $('caprect').setAttribute('x', bb.x - 28);
    $('caprect').setAttribute('width', bb.width + 56);
  }

  /* ---- cartão final ---- */
  const endO = ease(seg(t, 24.0, 25.0));
  $('end').setAttribute('opacity', endO);
  endArcs.forEach((p, i) => {
    p.setAttribute('stroke-dashoffset', p.L * (1 - ease(seg(t, 24.6 + i * 0.1, 26.0 + i * 0.1))));
  });
  [['t1', 25.2], ['t2', 26.2], ['t3', 27.0], ['t4', 27.6]].forEach(([id, s]) => {
    const p = ease(seg(t, s, s + 0.8));
    $(id).setAttribute('opacity', p);
    $(id).setAttribute('transform', `translate(0 ${(1 - p) * 24})`);
  });
}
render(0);
</script>
</body>
</html>
