<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const mk = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};
const rbCols = ['#ff6b6b', '#ff9f43', '#ffd84d', '#6bcb77', '#4d96ff', '#9b6bff'];
const SCENE = 8;            // segundos por cena
const TOTAL = 62;

/* ---- mão (cena 1) ---- */
const handSvg = '<ellipse cx="0" cy="0" rx="66" ry="52" fill="#e2b08c" stroke="#c48a64" stroke-width="3"/>' +
  '<ellipse cx="-42" cy="-52" rx="16" ry="44" fill="#e2b08c" transform="rotate(-16 -42 -52)"/>' +
  '<ellipse cx="-14" cy="-64" rx="16" ry="48" fill="#e2b08c" transform="rotate(-4 -14 -64)"/>' +
  '<ellipse cx="16" cy="-64" rx="16" ry="48" fill="#e2b08c" transform="rotate(5 16 -64)"/>' +
  '<ellipse cx="44" cy="-52" rx="15" ry="42" fill="#e2b08c" transform="rotate(16 44 -52)"/>' +
  '<ellipse cx="-62" cy="8" rx="15" ry="38" fill="#d9a27a" transform="rotate(-52 -62 8)"/>';
$('h1l').innerHTML = handSvg; $('h1r').innerHTML = handSvg;
const dustEls = Array.from({ length: 22 }, () => mk('circle', {}, $('dust')));

/* ---- desenho da cena 4 ---- */
const strokes4 = [];
rbCols.forEach((c, i) => {
  const r = 150 - i * 16;
  strokes4.push({ d: `M ${450 - r} 1105 A ${r} ${r} 0 0 1 ${450 + r} 1105`, c, w: 16, a: 1.0 + i * 0.7, b: 1.6 + i * 0.7 });
});
strokes4.push({ d: 'M 292 1000 a 26 26 0 1 1 52 0 a 26 26 0 1 1 -52 0', c: '#f5b800', w: 9, a: 5.3, b: 6.0 });
strokes4.push({ d: 'M 290 1050 q 20 -26 40 0 t 40 0', c: '#6bcb77', w: 8, a: 6.0, b: 6.5 });
strokes4.push({ d: 'M 600 1130 L 600 1050', c: '#3ea34a', w: 7, a: 6.5, b: 6.8 });
strokes4.push({ d: 'M 600 1034 a 18 18 0 1 1 0.1 0 Z', c: '#e85d9b', w: 8, a: 6.8, b: 7.3 });
const g4d = $('g4draw');
strokes4.forEach(s => {
  s.el = mk('path', { d: s.d, stroke: s.c, 'stroke-width': s.w }, g4d);
  s.L = s.el.getTotalLength();
  s.el.setAttribute('stroke-dasharray', s.L);
});

/* ---- folhas de outono (cena 5) ---- */
const leafCols = ['#e7822c', '#d9532c', '#f0a830', '#b8472a'];
const leafEls = Array.from({ length: 16 }, (_, i) => mk('path', { d: 'M 0 -12 Q 10 -2 0 14 Q -10 -2 0 -12 Z', fill: leafCols[i % 4] }, $('leaves')));

/* ---- bokeh (cena 6) ---- */
const bokehEls = Array.from({ length: 12 }, () => mk('circle', {}, $('bokeh')));

/* ---- aves (cena 7) ---- */
const birdEls = [0, 1, 2, 3].map(() => mk('path', {}, $('birds')));

/* ---- família de costas (cena 7) ---- */
function person(parent, o) {
  const g = mk('g', {}, parent);
  const legs = [0, 1].map(k => mk('line', { stroke: o.pants, 'stroke-width': o.lw, 'stroke-linecap': 'round' }, g));
  mk('path', { d: `M ${-o.w} ${-o.h} Q 0 ${-o.h - 14} ${o.w} ${-o.h} L ${o.w * 0.85} ${-o.h * 0.38} L ${-o.w * 0.85} ${-o.h * 0.38} Z`, fill: o.shirt }, g);
  mk('circle', { cx: 0, cy: -o.h - o.r * 1.1, r: o.r, fill: o.skin }, g);
  mk('path', { d: `M ${-o.r} ${-o.h - o.r * 1.1} Q ${-o.r} ${-o.h - o.r * 2.3} 0 ${-o.h - o.r * 2.25} Q ${o.r} ${-o.h - o.r * 2.3} ${o.r} ${-o.h - o.r * 1.1} Q 0 ${-o.h - o.r * 0.9} ${-o.r} ${-o.h - o.r * 1.1} Z${o.long ? ` M ${-o.r} ${-o.h - o.r} L ${-o.r * 1.1} ${-o.h + o.r * 1.2} L ${o.r * 1.1} ${-o.h + o.r * 1.2} L ${o.r} ${-o.h - o.r} Z` : ''}`, fill: o.hair }, g);
  return { g, legs, o };
}
const fam = $('fam');
const dad = person(fam, { w: 52, h: 250, r: 34, lw: 22, shirt: '#4a6fa5', pants: '#2f3b52', skin: '#c98f68', hair: '#2c1f19' });
const kid = person(fam, { w: 30, h: 135, r: 24, lw: 14, shirt: '#ffd54f', pants: '#3f5ca8', skin: '#e9b88f', hair: '#3b2a1d' });
const mom = person(fam, { w: 46, h: 235, r: 32, lw: 20, shirt: '#c25b6e', pants: '#6a4a5a', skin: '#e0b08c', hair: '#5a3a26', long: true });
const arms = [0, 1].map(() => mk('line', { stroke: '#e0b08c', 'stroke-width': 11, 'stroke-linecap': 'round' }, fam));
const shadows = [0, 1, 2].map(() => mk('polygon', { fill: '#2a1f3a', opacity: 0.35 }, $('g7')));
shadows.forEach(p => $('g7').insertBefore(p, $('fam')));

/* ---- cartão final ---- */
const endArcs = rbCols.map((c, i) => {
  const r = 230 - i * 24;
  const p = mk('path', { d: `M ${360 - r} 400 A ${r} ${r} 0 0 1 ${360 + r} 400`, stroke: c }, $('g8arc'));
  p.L = p.getTotalLength();
  p.setAttribute('stroke-dasharray', p.L);
  return p;
});

/* ---- cenas: entrada com fusão + zoom lento ---- */
const scenes = ['g1', 'g2', 'g3', 'g4', 'g5', 'g6', 'g7', 'g8'];
function zoom(el, s, z0, z1, cx, cy) {
  const z = lerp(z0, z1, clamp(s / SCENE));
  el.setAttribute('transform', `translate(${cx} ${cy}) scale(${z}) translate(${-cx} ${-cy})`);
}
const legCycle = (p, x, y, ph, len, amp) => {
  p.legs[0].setAttribute('x1', x - p.o.w * 0.35); p.legs[0].setAttribute('y1', y - p.o.h * 0.4);
  p.legs[1].setAttribute('x1', x + p.o.w * 0.35); p.legs[1].setAttribute('y1', y - p.o.h * 0.4);
  p.legs[0].setAttribute('x2', x - p.o.w * 0.35 + Math.sin(ph) * amp); p.legs[0].setAttribute('y2', y - Math.max(0, Math.cos(ph)) * 10);
  p.legs[1].setAttribute('x2', x + p.o.w * 0.35 - Math.sin(ph) * amp); p.legs[1].setAttribute('y2', y - Math.max(0, -Math.cos(ph)) * 10);
};

function render(T) {
  $('turb').setAttribute('seed', (Math.floor(T * 8) % 40) + 1);
  scenes.forEach((id, i) => {
    if (i > 0) $(id).setAttribute('opacity', seg(T, i * SCENE - 0.9, i * SCENE));
  });

  /* ===== 1: espera ===== */
  {
    const s = T;
    zoom($('g1'), s, 1.0, 1.06, 360, 900);
    const w = Math.sin(s * 1.3), w2 = Math.sin(s * 1.7 + 1);
    $('c1l').setAttribute('d', `M 40 60 L 250 60 L ${250 + w * 22} 380 Q ${240 + w2 * 30} 560 ${205 + w * 36} 700 L 40 700 Z`);
    $('c1r').setAttribute('d', `M 680 60 L 470 60 L ${470 - w2 * 22} 380 Q ${480 - w * 30} 560 ${515 - w2 * 36} 700 L 680 700 Z`);
    const kick = Math.exp(-Math.pow((s - 5.2) * 3, 2)) * 0.03;
    const br = 1 + Math.sin(s * 1.6) * 0.008 + kick;
    $('bel').setAttribute('transform', `translate(360 1000) scale(${br}) translate(-360 -1000)`);
    dustEls.forEach((c, i) => {
      c.setAttribute('cx', (i * 83 + Math.sin(s * 0.4 + i) * 40 + 720) % 720);
      c.setAttribute('cy', 140 + ((i * 131 + s * 14) % 560));
      c.setAttribute('r', 2 + (i % 3));
      c.setAttribute('opacity', 0.35 + 0.5 * Math.abs(Math.sin(s * 1.1 + i)));
    });
  }

  /* ===== 2: chegada ===== */
  {
    const s = T - SCENE;
    zoom($('g2'), s, 1.0, 1.07, 360, 640);
    const br = 1 + Math.sin(s * 2) * 0.012;
    $('baby').setAttribute('transform', `translate(360 880) scale(${br}) translate(-360 -880)`);
    [['tear2a', 0], ['tear2b', 0.9]].forEach(([id, d]) => {
      const p = seg(s, 2.0 + d, 4.6 + d), q = ((s - 2.0 - d) / 2.6) % 1;
      const e = $(id);
      e.setAttribute('cy', 372 + q * 70);
      e.setAttribute('opacity', p > 0 ? 0.9 * Math.sin(Math.PI * clamp(q)) : 0);
    });
  }

  /* ===== 3: crescer ===== */
  {
    const s = T - 2 * SCENE;
    zoom($('g3'), s, 1.0, 1.05, 360, 800);
    const prog = ease(seg(s, 0.6, 7.0));
    const x = lerp(130, 440, prog), ph = s * 5.2;
    const walking = seg(s, 0.4, 0.8) * (1 - seg(s, 6.8, 7.3));
    const wob = Math.sin(s * 2.6) * 7 * walking;
    $('tod').setAttribute('transform', `translate(${x + wob} ${Math.abs(Math.sin(ph)) * -5 * walking}) rotate(${Math.sin(ph / 2) * 2.5 * walking} 0 800)`);
    const set = (id, d) => $(id).setAttribute('d', d);
    const l1 = Math.sin(ph) * 22 * walking, l2 = -l1;
    set('tl1', `M -16 810 L ${-16 + l1} 928`); set('tl2', `M 16 810 L ${16 + l2} 928`);
    $('tf1').setAttribute('cx', -16 + l1); $('tf1').setAttribute('cy', 934);
    $('tf2').setAttribute('cx', 16 + l2); $('tf2').setAttribute('cy', 934);
    const up = 1 - seg(s, 6.4, 7.4) * 0.6, aw = Math.sin(ph) * 8 * walking;
    set('ta1', `M -34 722 Q -70 ${690 + aw} -84 ${650 * up + 700 * (1 - up) + aw}`);
    set('ta2', `M 34 722 Q 70 ${690 - aw} 84 ${650 * up + 700 * (1 - up) - aw}`);
    const tx = x + wob, close = seg(s, 6.2, 7.6);
    const h1 = { x: lerp(430, tx + 50, close), y: lerp(790, 780, close) }, h2 = { x: lerp(440, tx + 52, close), y: lerp(870, 850, close) };
    set('mArm1', `M 562 740 Q 500 ${760 + Math.sin(s * 2) * 6} ${h1.x} ${h1.y}`);
    set('mArm2', `M 574 760 Q 510 ${830 + Math.sin(s * 2 + 1) * 6} ${h2.x} ${h2.y}`);
  }

  /* ===== 4: imaginação ===== */
  {
    const s = T - 3 * SCENE;
    zoom($('g4'), s, 1.0, 1.05, 360, 900);
    strokes4.forEach(st => st.el.setAttribute('stroke-dashoffset', st.L * (1 - seg(s, st.a, st.b))));
    let pen = { x: 430, y: 1060 + Math.sin(s * 2) * 8 }, col = '#ff6b6b';
    for (let i = 0; i < strokes4.length; i++) {
      const st = strokes4[i];
      if (s >= st.a) {
        const p = seg(s, st.a, st.b), pt = st.el.getPointAtLength(st.L * p);
        let from = pt;
        if (i > 0) from = strokes4[i - 1].el.getPointAtLength(strokes4[i - 1].L);
        const w = ease(seg(s, st.a, st.a + 0.3));
        pen = { x: lerp(from.x, pt.x, w), y: lerp(from.y, pt.y, w) };
        col = st.c;
      }
    }
    const sh = { x: 380, y: 760 };
    $('g4arm').setAttribute('d', `M ${sh.x} ${sh.y} Q ${sh.x + (pen.x - sh.x) * 0.3 + 60} ${sh.y + (pen.y - sh.y) * 0.6} ${pen.x} ${pen.y}`);
    $('g4hand').setAttribute('cx', pen.x); $('g4hand').setAttribute('cy', pen.y);
    $('g4paint').setAttribute('cx', pen.x + 6); $('g4paint').setAttribute('cy', pen.y - 8); $('g4paint').setAttribute('fill', col);
    $('g4brush').setAttribute('x1', pen.x); $('g4brush').setAttribute('y1', pen.y);
    $('g4brush').setAttribute('x2', pen.x - 10); $('g4brush').setAttribute('y2', pen.y + 34);
  }

  /* ===== 5: o tempo passa ===== */
  {
    const s = T - 4 * SCENE;
    zoom($('g5'), s, 1.0, 1.05, 360, 800);
    const sway = Math.sin(s * 0.9) * 3;
    $('g5hug').setAttribute('transform', `translate(0 ${Math.sin(s * 1.2) * 3}) rotate(${sway * 0.3} 380 900)`);
    $('g5hand').setAttribute('cy', 838 + Math.sin(s * 1.6) * 8);
    $('g5hand').setAttribute('cx', 318 + Math.sin(s * 1.6) * 4);
    leafEls.forEach((e, i) => {
      const x = (i * 59 + Math.sin(s * 0.8 + i * 1.3) * 60 + 900) % 760 - 20;
      const y = ((i * 211 + s * 70) % 1380) - 60;
      e.setAttribute('transform', `translate(${x} ${y}) rotate(${s * 60 + i * 50}) scale(${0.9 + (i % 3) * 0.3})`);
    });
  }

  /* ===== 6: continuidade ===== */
  {
    const s = T - 5 * SCENE;
    zoom($('g6'), s, 1.0, 1.06, 360, 800);
    const b = Math.sin(s * 1.5) * 4;
    $('g6hands').setAttribute('transform', `translate(0 ${b})`);
    bokehEls.forEach((c, i) => {
      c.setAttribute('cx', (i * 97 + Math.sin(s * 0.3 + i) * 30 + 720) % 720);
      c.setAttribute('cy', 80 + (i * 173) % 700);
      c.setAttribute('r', 20 + (i % 4) * 16);
      c.setAttribute('opacity', 0.12 + 0.12 * Math.abs(Math.sin(s * 0.7 + i)));
    });
  }

  /* ===== 7: futuro ===== */
  {
    const s = T - 6 * SCENE;
    const z = lerp(1.0, 0.82, seg(s, 0, SCENE));
    const bx = 360, by = lerp(1210, 1040, seg(s, 0, SCENE));
    const sc = lerp(1.0, 0.72, seg(s, 0, SCENE));
    const ph = s * 3.2;
    $('fam').setAttribute('transform', `translate(${bx} ${by}) scale(${sc})`);
    const bob = a => Math.abs(Math.sin(ph + a)) * -5;
    dad.g.setAttribute('transform', `translate(-130 ${bob(0)})`);
    kid.g.setAttribute('transform', `translate(0 ${bob(0.5)})`);
    mom.g.setAttribute('transform', `translate(130 ${bob(0.2)})`);
    legCycle(dad, 0, 0, ph, 0, 18); legCycle(kid, 0, 0, ph + 0.5, 0, 12); legCycle(mom, 0, 0, ph + 0.2, 0, 16);
    arms[0].setAttribute('x1', -130 + dad.o.w * 0.9); arms[0].setAttribute('y1', -dad.o.h * 0.8 + bob(0));
    arms[0].setAttribute('x2', -30 + 0); arms[0].setAttribute('y2', -kid.o.h * 0.78 + bob(0.5));
    arms[1].setAttribute('x1', 130 - mom.o.w * 0.9); arms[1].setAttribute('y1', -mom.o.h * 0.8 + bob(0.2));
    arms[1].setAttribute('x2', 30); arms[1].setAttribute('y2', -kid.o.h * 0.78 + bob(0.5));
    shadows.forEach((p, i) => {
      const x0 = bx + [-130, 0, 130][i] * sc, w = [26, 14, 24][i] * sc, len = [520, 330, 480][i] * sc;
      p.setAttribute('points', `${x0 - w} ${by} ${x0 + w} ${by} ${x0 + w * 2.4 + 90} ${by + len} ${x0 - w * 1.2 + 70} ${by + len}`);
    });
    birdEls.forEach((p, i) => {
      const x = (i * 190 + s * 26) % 820 - 40, y = 300 + i * 54 + Math.sin(s * 1.5 + i) * 14, f = Math.sin(s * 6 + i) * 8;
      p.setAttribute('d', `M ${x - 18} ${y - f} Q ${x - 8} ${y - 8} ${x} ${y} Q ${x + 8} ${y - 8} ${x + 18} ${y - f}`);
    });
    $('g7').setAttribute('transform', `translate(360 640) scale(${lerp(1.0, 1.03, seg(s, 0, SCENE))}) translate(-360 -640)`);
  }

  /* ===== 8: cartão final ===== */
  {
    const s = T - 7 * SCENE;
    endArcs.forEach((p, i) => p.setAttribute('stroke-dashoffset', p.L * (1 - ease(seg(s, 0.3 + i * 0.1, 1.7 + i * 0.1)))));
    [['f1', 1.4], ['f2', 2.4], ['f3', 3.2], ['f4', 3.8]].forEach(([id, st]) => {
      const p = ease(seg(s, st, st + 0.8));
      $(id).setAttribute('opacity', p);
      $(id).setAttribute('transform', `translate(0 ${(1 - p) * 24})`);
    });
  }
}
render(0);
</script>
</body>
</html>
