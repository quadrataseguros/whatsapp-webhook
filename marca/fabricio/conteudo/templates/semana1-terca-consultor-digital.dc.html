<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body>
<div id="card" style="width: 1080px; height: 1350px; background: radial-gradient(circle at 30% 22%, #16386b 0%, #0b1c38 58%); padding: 96px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 44px">
  <svg width="140" height="140" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <path d="M63.5 31.62 A27 27 0 1 1 36.5 31.62" stroke="#4da3ff" stroke-width="10" stroke-linecap="round"></path>
    <path d="M62 67 L75 80" stroke="#4da3ff" stroke-width="10" stroke-linecap="round"></path>
    <path d="M50 13 L50 47" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"></path>
  </svg>
  <div style="font-family:'Space Grotesk',sans-serif; font-size: 68px; font-weight: 700; line-height: 1.18; color: #ffffff; max-width: 820px">Sou o consultor digital da Quadrata.</div>
  <div style="font-size: 36px; line-height: 1.5; color: #a8bcd8; max-width: 780px">Respondo agora, de madrugada, no domingo, a qualquer hora. Oriento e já adianto sua cotação &mdash; e um consultor humano da Quadrata acompanha todo o processo, pra você ter suporte completo na contratação.</div>
  <div style="display:flex; align-items:center; gap:18px; margin-top: 16px">
    <div style="width: 14px; height: 14px; border-radius: 50%; background: #22d3ee; flex-shrink: 0"></div>
    <div style="font-family:'Space Grotesk',sans-serif; font-size: 30px; font-weight: 600; color: #22d3ee; letter-spacing: 0.02em">Chama no direct</div>
  </div>
</div>
