<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: #2f89f5; } a:hover { color: #1d6fd6; }
  </style>
</helmet>
<div style="width: 880px; height: 560px; background: #f8fafc; display: flex; align-items: center; justify-content: center">
  <div style="display: flex; align-items: center; gap: 30px">
    <svg width="116" height="116" viewBox="0 0 100 100" fill="none" aria-label="FabrícIO" role="img">
      <path d="M63.5 31.62 A27 27 0 1 1 36.5 31.62" stroke="{{marca}}" stroke-width="10" stroke-linecap="round"></path>
      <path d="M62 67 L75 80" stroke="{{marca}}" stroke-width="10" stroke-linecap="round"></path>
      <path d="M50 13 L50 47" stroke="{{sinal}}" stroke-width="10" stroke-linecap="round"></path>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 15px">
      <div style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 82px; line-height: 1; letter-spacing: -0.035em; color: #122c56">Fabríc<span style="color: {{marca}}">IO</span></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="font-size: 17px; font-weight: 500; color: #475569">Seu consultor de seguros digital</span>
        <span style="display: flex; align-items: center; gap: 7px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: {{sinal}}; box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.18)"></span>
          <span style="font-size: 17px; font-weight: 700; color: #0e7490; letter-spacing: 0.02em">ON 24h</span>
        </span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"marca":{"editor":"color","default":"#2f89f5","options":["#2f89f5","#122c56","#0ea5e9","#8b5cf6"]},"sinal":{"editor":"color","default":"#06b6d4","options":["#06b6d4","#22c55e","#f97316","#2f89f5"]}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      marca: this.props.marca ?? '#2f89f5',
      sinal: this.props.sinal ?? '#06b6d4',
    };
  }
}
</script>
</body>
</html>
