<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    a { color: #2f89f5; } a:hover { color: #1d6fd6; }
  </style>
</helmet>
<div style="width: 880px; height: 560px; background: #f8fafc; display: flex; align-items: center; justify-content: center">
  <div style="display: flex; align-items: center; gap: 28px">
    <svg width="108" height="108" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="fioMain" x1="22" y1="10" x2="78" y2="90" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="{{accent}}"></stop>
          <stop offset="1" stop-color="#22d3ee"></stop>
        </linearGradient>
      </defs>
      <path d="M65.9 30.56 A30 30 0 1 1 34.1 30.56" stroke="url(#fioMain)" stroke-width="11" stroke-linecap="round"></path>
      <path d="M50 14 L50 50" stroke="url(#fioMain)" stroke-width="11" stroke-linecap="round"></path>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 82px; line-height: 1; letter-spacing: -0.035em; color: #122c56">Fabríc<span style="color: {{accent}}">IO</span></div>
      <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: #64748b">Consultor digital · Quadrata Seguros</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2f89f5","options":["#2f89f5","#0ea5e9","#22d3ee","#8b5cf6"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2f89f5' };
  }
}
</script>
</body>
</html>
